[build-system]
build-backend = "hatchling.build"
requires = [ "hatchling" ]

[project]
name = "wagtail-mfa"
description = "Secure your Wagtail site with multi-factor authentication. Supports TOTP and WebAuthn/Passkeys."
readme = "README.md"
keywords = [ "2fa", "mfa", "passkeys", "security", "totp", "wagtail", "webauthn" ]
license = "BSD-3-Clause"
authors = [
  { name = "Storm B. Heg", email = "storm@stormbase.digital" },
]
requires-python = ">=3.10"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Web Environment",
  "Framework :: Django",
  "Framework :: Django :: 4.2",
  "Framework :: Django :: 5.0",
  "Framework :: Django :: 5.1",
  "Framework :: Django :: 5.2",
  "Framework :: Django :: 6.0",
  "Framework :: Wagtail",
  "Framework :: Wagtail :: 6",
  "Framework :: Wagtail :: 7",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Security",
]
dynamic = [ "version" ]
dependencies = [
  "django>=4.2",
  "django-otp>=1,<2",
  "django-otp-webauthn>=0.1,<1",
  "precis-i18n>=1.1,<2",
  "wagtail>=6.3",
]

optional-dependencies.testing = [
  "coverage[toml]>=7,<8",
  "dj-database-url>=2.1,<3",
  # To test functionality with a strict Content Security Policy
  "django-csp>=4.0b2,<5",
  "django-debug-toolbar>5,<6",
  # Update as necessary, prevent sudden breakage
  "pytest>8,<9",
  "pytest-django>4.5,<5",
  "pytest-env>=1,<2",
  "pytest-factoryboy>=2,<3",
  "pytest-randomly>=3.15,<4",
]
# TODO: documentation link
# Documentation = "https://github.com/Stormbase/wagtail-mfa/"
urls.Changelog = "https://github.com/Stormbase/wagtail-mfa/blob/main/CHANGELOG.md"
urls.Issues = "https://github.com/Stormbase/wagtail-mfa/issues"
urls.Source = "https://github.com/Stormbase/wagtail-mfa"

[tool.hatch.version]
path = "src/wagtail_mfa/__init__.py"

[tool.hatch.build.targets.wheel]
artifacts = [
  # Include built static files that are gitignored and thus not included by default
  "src/wagtail_mfa/static/wagtail_mfa/*",
  # Include compiled translations that are gitignored and thus not included by default
  "src/wagtail_mfa/locale/*/LC_MESSAGES/*.mo",
]

[tool.hatch.build.targets.sdist]
artifacts = [
  # Include built static files that are gitignored and thus not included by default
  "src/wagtail_mfa/static/wagtail_mfa/*",
  # Include compiled translations that are gitignored and thus not included by default
  "src/wagtail_mfa/locale/*/LC_MESSAGES/*.mo",
  "sandbox/locale/*/LC_MESSAGES/*.mo",
]
# Manually specify what to include, otherwise it becomes a mess
include = [
  "src/wagtail_mfa",
  "sandbox/",
  "client/",
  "tests/",
  "scripts/",
  "README.md",
  "LICENSE",
  "CHANGELOG.md",
  "CONTRIBUTORS.md",
  "SECURITY.md",
  "pyproject.toml",
]

[tool.hatch.envs.default]
dependencies = [
  "wagtail-mfa[testing]",
]

[tool.hatch.envs.hatch-static-analysis]
# Do not use Hatch default configuration
config-path = "pyproject.toml"
dependencies = [  ]

[tool.ruff]
target-version = "py39" # minimum target version

lint.select = [
  "BLE", # flake8-blind-except
  "C4",  # flake8-comprehensions
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "I",   # isort
  "T20", # flake8-print
  "UP",  # pyupgrade
]
# E501: Line too long
lint.ignore = [ "E501" ]
lint.isort.known-first-party = [ "wagtail_mfa", "sandbox", "tests" ]

[tool.pytest.ini_options]
pythonpath = "sandbox"
DJANGO_SETTINGS_MODULE = "settings"
testpaths = "tests/"
norecursedirs = [ "tests/e2e" ]
addopts = "--reuse-db"

[tool.coverage.run]
source_pkgs = [ "wagtail_mfa" ]
branch = true
omit = [ "*/migrations/*", "*/tests/*" ]

[tool.coverage.report]
exclude_lines = [
  # Have to re-enable the standard pragma
  "pragma: no cover",

  # Don't complain about missing debug-only code:
  "def __repr__",
  "if self.debug",

  # Don't complain if tests don't hit defensive assertion code:
  "raise AssertionError",
  "raise NotImplementedError",

  # Don't complain if non-runnable code isn't run:
  "if 0:",
  "if __name__ == .__main__.:",

  # Don't complain about abstract methods, they aren't run:
  "@(abc.)?abstractmethod",

  # Nor complain about type checking
  "if TYPE_CHECKING:",
]
